<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ètó</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    /* Earthy Maximalist Nigerian Palette */
    --indigo-deep: #1A233A;
    --indigo-light: #2A3A5C;
    --terracotta: #C05621;
    --terracotta-dark: #9A3E12;
    --gold: #D4AF37;
    --gold-dim: #B5952F;
    --forest: #2D5A27;
    --clay: #8B5A2B;
    --cream: #F5F0E6;
    --cream-dark: #E8DFD0;
    --text-main: #1A1512;
    --text-muted: #5C4D3C;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    /* Rich, woven Adire-inspired background pattern */
    background-color: var(--indigo-deep);
    background-image:
      repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(212, 175, 55, 0.04) 10px, rgba(212, 175, 55, 0.04) 20px),
      repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(42, 58, 92, 0.6) 10px, rgba(42, 58, 92, 0.6) 20px),
      radial-gradient(circle at 50% 50%, rgba(192, 86, 33, 0.1) 0%, transparent 60%);
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* --- Maximalist Card Styling --- */
  .auth-card, .section-card, .module-block {
    background: var(--cream);
    border: 2px solid var(--gold);
    box-shadow: 6px 6px 0px var(--indigo-light);
    position: relative;
    padding: 32px 28px;
  }
  
  /* Decorative corner brackets for maximalist framing */
  .auth-card::before, .section-card::before, .module-block::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px;
    width: 16px; height: 16px;
    border-top: 3px solid var(--terracotta);
    border-left: 3px solid var(--terracotta);
  }
  .auth-card::after, .section-card::after, .module-block::after {
    content: '';
    position: absolute;
    bottom: -2px; right: -2px;
    width: 16px; height: 16px;
    border-bottom: 3px solid var(--terracotta);
    border-right: 3px solid var(--terracotta);
  }

  .auth-card { width: 100%; max-width: 400px; padding: 40px 32px 34px; }
  .auth-card.wide { max-width: 500px; }

  /* --- Typography & Flourishes --- */
  .auth-title {
    font-family: 'Fraunces', serif;
    font-size: 42px;
    font-weight: 900;
    text-align: center;
    margin: 0 0 4px;
    color: var(--indigo-deep);
    letter-spacing: -0.02em;
  }
  .auth-flourish { display: block; margin: 0 auto 16px; color: var(--terracotta); }
  .auth-subtitle {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    text-align: center;
    font-size: 22px;
    color: var(--terracotta);
    margin: 0 0 32px;
  }

  /* --- Forms & Inputs --- */
  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: 'IBM Plex Mono', monospace;
  }
  .field input {
    width: 100%;
    border: none;
    border-bottom: 2px solid var(--gold-dim);
    background: transparent;
    padding: 12px 4px;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    color: var(--text-main);
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus { border-bottom-color: var(--terracotta); }
  .field input::placeholder { color: var(--text-muted); opacity: 0.6; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; }

  /* --- Buttons (Tactile, Stamped-Clay Feel) --- */
  .btn {
    width: 100%;
    background: var(--terracotta);
    color: var(--cream);
    border: 2px solid var(--gold);
    padding: 14px;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    margin-top: 12px;
    box-shadow: 4px 4px 0px var(--indigo-deep);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--indigo-deep); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0px var(--indigo-deep); }

  .toggle-row {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
    color: var(--text-muted);
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .toggle-row button {
    background: none;
    border: none;
    color: var(--terracotta);
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 0;
    font-family: inherit;
  }

  .message {
    padding: 12px;
    margin-bottom: 20px;
    font-size: 13px;
    text-align: center;
    font-weight: 600;
    display: none;
    border-left: 4px solid;
  }
  .message.show { display: block; }
  .message.error { background: #f5e3e0; border-left-color: var(--terracotta); color: var(--terracotta-dark); }
  .message.success { background: #e6ecdf; border-left-color: var(--forest); color: var(--forest); }

  /* --- Home Dashboard --- */
  body.home-mode { align-items: flex-start; padding: 0; }
  .home-wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 20px 60px; }
  
  .home-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
  .home-title { font-family: 'Fraunces', serif; font-size: 48px; font-weight: 900; color: var(--cream); letter-spacing: -0.02em; text-shadow: 2px 2px 0px rgba(0,0,0,0.3); }
  
  .date-stamp {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 14px;
    color: var(--gold);
    background: var(--terracotta);
    border: 2px solid var(--gold);
    width: 70px; height: 70px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    line-height: 1.1;
    transform: rotate(-6deg);
    flex-shrink: 0;
    box-shadow: 3px 3px 0px var(--indigo-deep);
  }
  .date-stamp br { margin-bottom: 2px; }

  .logout-link { 
    background: rgba(245, 240, 230, 0.1); 
    border: 1px solid var(--gold-dim); 
    color: var(--gold); 
    padding: 6px 12px;
    font-size: 11px; 
    font-weight: 700; 
    cursor: pointer; 
    text-transform: uppercase; 
    letter-spacing: 0.1em; 
    font-family: 'IBM Plex Mono', monospace;
    transition: all 0.2s;
  }
  .logout-link:hover { background: var(--gold); color: var(--indigo-deep); }

  .home-date { font-size: 14px; color: var(--cream-dark); margin-bottom: 24px; font-family: 'IBM Plex Mono', monospace; opacity: 0.8; }

  /* --- Navigation Strip --- */
  .nav-strip-wrap { position: relative; margin-bottom: 28px; }
  .nav-strip-wrap::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 4px;
    width: 40px;
    background: linear-gradient(to right, transparent, var(--indigo-deep));
    pointer-events: none;
  }
  .nav-strip { display: flex; gap: 10px; overflow-x: auto; padding: 8px 4px 12px; margin-bottom: 0; scrollbar-width: thin; scrollbar-color: var(--terracotta) var(--indigo-deep); }
  .nav-strip::-webkit-scrollbar { height: 6px; }
  .nav-strip::-webkit-scrollbar-track { background: var(--indigo-deep); }
  .nav-strip::-webkit-scrollbar-thumb { background: var(--terracotta); border-radius: 3px; }
  
  .nav-chip {
    flex-shrink: 0;
    padding: 10px 18px;
    border: 1px solid var(--gold);
    font-family: 'Fraunces', serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--cream);
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 3px 3px 0px rgba(0,0,0,0.4);
    transition: transform 0.1s;
  }
  .nav-chip:nth-child(odd) { transform: translateY(-3px); }
  .nav-chip:active { transform: translateY(1px) translateX(1px); box-shadow: 1px 1px 0px rgba(0,0,0,0.4); }

  /* --- Section Cards --- */
  .section-card { margin-bottom: 20px; padding: 24px; }
  .section-title { 
    font-family: 'Fraunces', serif; 
    font-size: 20px; 
    font-weight: 900; 
    margin-bottom: 16px; 
    color: var(--indigo-deep);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--gold) 0, var(--gold) 4px, transparent 4px, transparent 8px);
    opacity: 0.5;
  }

  /* --- Calendar Strip --- */
  .cal-strip { display: flex; gap: 8px; }
  .cal-day { 
    cursor: pointer;
    flex: 1; 
    border: 1px solid var(--gold-dim); 
    background: var(--cream-dark);
    padding: 12px 4px; 
    text-align: center; 
    transition: all 0.2s;
    font: inherit;
    color: var(--text-main);
  }
  .cal-day.is-today { 
    background: var(--terracotta); 
    border-color: var(--gold); 
    box-shadow: 2px 2px 0px var(--indigo-deep);
    transform: translateY(-2px);
  }
  .cal-day .dow { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .cal-day.is-today .dow { color: var(--gold); }
  .cal-day .dnum { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 900; margin-top: 4px; color: var(--indigo-deep); }
  .cal-day.is-today .dnum { color: var(--cream); }
  .cal-day.is-selected { outline: 2px solid var(--indigo-deep); outline-offset: 2px; }
  .cal-day-items { margin-top: 8px; text-align: left; font-size: 10px; line-height: 1.35; }
  .cal-day-item { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid; padding-left: 4px; margin-top: 3px; }
  .calendar-day-details { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--gold-dim); }
  .academic-course-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 10px; }
  .academic-course-form input, .academic-course-form select { min-width: 0; padding: 9px; border: 1px solid var(--gold-dim); background: var(--cream); font: inherit; }
  .academic-course-form .inline-add-btn { width: auto; padding: 8px 12px; font-size: 13px; }
  .academic-course-card { margin: 10px 0; padding: 12px; border: 1px solid var(--gold-dim); border-left: 4px solid var(--course-color, var(--forest)); background: #fffaf0; }
  .academic-course-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .academic-course-meta { margin-top: 4px; color: var(--text-muted); font-size: 11px; }
  .academic-grade-pill { flex: none; padding: 5px 8px; background: var(--parchment); color: var(--indigo-deep); font: 700 12px 'IBM Plex Mono', monospace; }
  .academic-course-progress { height: 6px; margin: 10px 0; background: var(--cream-dark); }
  .academic-course-progress span { display: block; height: 100%; background: var(--course-color, var(--forest)); }
  .academic-grade-category { display: grid; grid-template-columns: minmax(100px, 1fr) minmax(80px, .8fr) minmax(90px, 1fr) auto auto; align-items: center; gap: 7px; padding: 8px 0; border-top: 1px dashed var(--gold-dim); font-size: 12px; }
  .academic-grade-category input { min-width: 0; width: 100%; padding: 6px; border: 1px solid var(--gold-dim); background: white; font: inherit; }
  .academic-points-inputs { display: flex; gap: 4px; }
  .academic-grade-category button { border: 1px solid var(--gold-dim); padding: 5px 7px; background: var(--cream); color: var(--indigo-deep); cursor: pointer; }
  .academic-category-form { display: grid; grid-template-columns: 1.2fr .8fr .8fr auto; gap: 7px; margin-top: 8px; }
  .academic-category-form input { min-width: 0; width: 100%; padding: 8px; border: 1px solid var(--gold-dim); background: white; font: inherit; }
  .academic-category-form button { border: 1px solid var(--cat-accent, var(--forest)); padding: 6px 9px; background: var(--cream); color: var(--cat-accent, var(--forest)); cursor: pointer; font-weight: 700; }
  .academic-course-settings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .academic-course-settings input { width: 90px; padding: 6px; border: 1px solid var(--gold-dim); background: white; font: inherit; }
  .academic-course-settings button { border: 0; background: none; color: var(--text-muted); cursor: pointer; text-decoration: underline; font: inherit; font-size: 11px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  @media (max-width: 640px) {
    .academic-grade-category { grid-template-columns: 1fr 1fr; }
    .academic-category-form { grid-template-columns: 1fr 1fr; }
  }
  .academic-dashboard { border-left: 0; padding: 0; background: transparent; }
  .academic-dashboard .module-title { margin: 0 0 14px; }
  .academic-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .academic-panel { margin: 0 0 14px; padding: 18px; border: 1px solid var(--gold-dim); border-top: 3px double var(--cat-accent, var(--forest)); background: var(--cream); }
  .academic-risk-panel { border-top-color: #B94A3A; border-color: #d8a49b; }
  .academic-risk-panel strong { color: #B94A3A; }
  .academic-panel h3 { margin: 0 0 12px; }
  .academic-calendar-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .academic-calendar-toolbar strong { font: 700 16px 'Fraunces', serif; color: var(--indigo-deep); }
  .academic-calendar-actions { display: flex; gap: 6px; }
  .academic-calendar-actions button { min-width: 34px; min-height: 32px; border: 1px solid var(--gold-dim); background: var(--parchment); color: var(--indigo-deep); cursor: pointer; font: 600 12px 'IBM Plex Mono', monospace; }
  .academic-calendar-actions button:hover { border-color: var(--cat-accent, var(--forest)); }
  .academic-month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .academic-weekday { padding: 7px 2px; color: var(--text-muted); text-align: center; font: 600 10px 'IBM Plex Mono', monospace; text-transform: uppercase; }
  .academic-date-cell { min-width: 0; min-height: 86px; padding: 6px; border: 1px solid var(--gold-dim); background: #fffaf0; color: var(--text-main); text-align: left; cursor: pointer; }
  .academic-date-cell:hover { border-color: var(--cat-accent, var(--forest)); }
  .academic-date-cell.is-outside { opacity: .45; background: var(--cream-dark); }
  .academic-date-cell.is-today { box-shadow: inset 0 0 0 1px var(--terracotta); }
  .academic-date-cell.is-selected { border: 2px solid var(--cat-accent, var(--forest)); padding: 5px; background: #f1ead8; }
  .academic-date-number { display: block; margin-bottom: 5px; font: 700 12px 'IBM Plex Mono', monospace; }
  .academic-date-cell.is-today .academic-date-number { color: var(--terracotta); }
  .academic-event-chip { display: block; overflow: hidden; margin-top: 3px; padding: 2px 4px; border-left: 3px solid; background: rgba(255,255,255,.72); font-size: 10px; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
  .academic-agenda { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--gold-dim); }
  .academic-agenda-title { margin-bottom: 5px; font: 700 13px 'Fraunces', serif; color: var(--indigo-deep); }
  .academic-panel .inline-add-row { flex-wrap: wrap; }
  .academic-panel .inline-add-row input, .academic-panel .inline-add-row select { min-width: 110px; padding: 9px; border: 1px solid var(--gold-dim); background: #fffaf0; font: inherit; }
  .academic-panel .inline-add-btn { width: auto; min-width: 40px; padding: 8px 12px; font-size: 13px; }
  @media (max-width: 640px) {
    .academic-panel { padding: 12px; }
    .academic-summary { grid-template-columns: 1fr; }
    .academic-date-cell { min-height: 66px; padding: 4px; }
    .academic-date-cell.is-selected { padding: 3px; }
    .academic-event-chip { font-size: 9px; }
  }

  /* --- Tasks & Lists --- */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }

  .task-item, .item-row, .cat-row { 
    display: flex; 
    align-items: flex-start; 
    gap: 12px; 
    padding: 12px 0; 
    border-bottom: 1px dashed var(--gold-dim); 
    cursor: pointer; 
    text-align: left; 
    transition: background 0.2s;
  }
  .task-item:last-child, .item-row:last-child, .cat-row:last-child { border-bottom: none; }
  .task-item:hover, .item-row:hover { background: rgba(212, 175, 55, 0.1); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 4px; }

  .task-checkbox, .item-checkbox, .test-checkbox { 
    width: 20px; height: 20px; 
    border: 2px solid var(--clay); 
    background: var(--cream);
    flex-shrink: 0; 
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--cream);
    transition: all 0.2s;
  }
  .task-checkbox.checked, .item-checkbox.checked, .test-checkbox.checked { 
    background: var(--forest); 
    border-color: var(--forest); 
    color: var(--gold);
    box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
  }

  .task-label, .item-label { font-size: 14.5px; line-height: 1.5; color: var(--text-main); font-weight: 500; }
  .task-label.done, .item-label.done { text-decoration: line-through; color: var(--text-muted); opacity: 0.7; }
  .task-cat { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--terracotta); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; font-weight: 600; }

  /* --- Quotes & Plants --- */
  .quote-card-inner { position: relative; padding: 12px 4px 12px 24px; }
  .quote-mark { position: absolute; top: -16px; left: -8px; font-family: 'Fraunces', serif; font-size: 72px; color: var(--terracotta); opacity: 0.2; font-weight: 900; line-height: 1; pointer-events: none; }
  .quote-text { font-family: 'Fraunces', serif; font-style: italic; font-size: 17px; line-height: 1.6; color: var(--indigo-deep); position: relative; }
  
  .plant-name { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 900; margin-bottom: 4px; color: var(--forest); }
  .plant-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .plant-tip { font-size: 14px; line-height: 1.6; color: var(--text-main); margin-top: 8px; border-left: 2px solid var(--gold); padding-left: 12px; }
  
  .leaf-corner { position: absolute; top: -1px; right: 8px; width: 32px; height: 32px; opacity: 0.6; pointer-events: none; color: var(--forest); }

  /* --- Category Page --- */
  .cat-page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .back-link { 
    background: none; border: none; color: var(--gold); font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em; font-family: 'IBM Plex Mono', monospace; padding: 0; 
    display: flex; align-items: center; gap: 6px;
  }
  .back-link:hover { color: var(--cream); }
  
  .cat-page-title { 
    font-family: 'Fraunces', serif; 
    font-size: 36px; 
    font-weight: 900; 
    margin: 12px 0 28px; 
    padding-bottom: 12px; 
    color: var(--cream);
    border-bottom: 3px double var(--cat-accent, var(--gold)); 
  }
  
  .module-block { margin-bottom: 16px; padding: 20px; background: var(--cream); border-left: 4px solid var(--cat-accent, var(--terracotta)); }
  .academic-dashboard h3 { margin: 14px 0 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .academic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .academic-stat { flex: 1; min-width: 120px; padding: 12px; background: var(--parchment); border-top: 3px solid var(--cat-accent, var(--terracotta)); }
  .academic-stat b, .academic-stat span { display: block; }
  .academic-stat span, .muted-small { color: var(--text-muted); font-size: 11px; }
  .module-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 900; margin-bottom: 14px; color: var(--indigo-deep); }

  .inline-add-row { display: flex; gap: 8px; margin-top: 14px; }
  .inline-add-row input { 
    flex: 1; 
    border: 1px solid var(--gold-dim); 
    background: var(--cream); 
    padding: 10px 12px; 
    font-family: 'IBM Plex Sans', sans-serif; 
    font-size: 14px; 
    outline: none; 
    color: var(--text-main);
  }

async function enterApp() {
  $('#homeWrap').style.display = 'block';
  document.body.classList.add('home-mode');
  await loadLedger();
}

async function loadLedger() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;

  const { data, error } = await sb
    .from('app_data')
    .select('value')
    .eq('user_id', user.id)
    .eq('key', LEDGER_KEY)
    .maybeSingle();

  if (error) {
    $('#saveIndicator').textContent = 'Load failed: ' + error.message;
    return;
  }

  if (data && data.value && data.value.version === DATA_VERSION) {
    ledgerData = data.value;
  } else {
    ledgerData = JSON.parse(JSON.stringify(DEFAULT_DATA));
    await persistLedger();
  }
  const academics = ledgerData.categories.find(c => c.id === 'academics');
  if (academics && !academics.modules.some(m => m.type === 'academicDashboard')) {
    academics.modules.unshift({ id: 'academic-dashboard', title: 'Academic Planner & Progress', type: 'academicDashboard',
      academic: { termStart: '', termEnd: '', riskThreshold: 70, classes: [], events: [] } });
    await persistLedger();
  }

  renderHome();
}

async function persistLedger() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  const indicator = $('#saveIndicator');
  indicator.textContent = 'Saving…';
  const { error } = await sb.from('app_data').upsert({
    user_id: user.id,
    key: LEDGER_KEY,
    value: ledgerData,
    updated_at: new Date().toISOString()
  });
  indicator.textContent = error ? ('Save failed: ' + error.message) : 'Saved ✓';
  if (!error) setTimeout(() => { if (indicator.textContent === 'Saved ✓') indicator.textContent = ''; }, 2000);
}

  const end = a.termEnd ? new Date(a.termEnd + 'T00:00:00') : null;

  if (start && end && end > start) {
    const elapsed = Math.max(0, Math.min(1, (today - start) / (end - start)));

    });
    const totalCategoryWeight = categories.reduce((sum, category) => sum + (Number(category.weight) || 0), 0);
    const gradedCategories = categories.filter(category => c.gradingSystem === 'Total points'
      ? category.earned != null && category.earned !== '' && Number(category.possible) > 0 && Number.isFinite(Number(category.earned))
      : category.score != null && category.score !== '' && Number.isFinite(Number(category.score)));
    const weight = Number(c.finalWeight) || 0;
    const target = Number(c.targetGrade) || 0;
    const needed = current != null && weight > 0 ? (target - current * (1 - weight / 100)) / (weight / 100) : null;

          : `<label class="sr-only" for="acad-score-${c.id}-${category.id}">Score for ${category.name} (%)</label><input id="acad-score-${c.id}-${category.id}" type="number" min="0" max="100" step="0.1" value="${category.score != null && category.score !== '' ? category.score : ''}" placeholder="Score %">`}

        <button onclick="deleteAcademicCategory('${mod.id}','${c.id}','${category.id}')" aria-label="Remove ${category.name}">×</button>
      </div>`;
    }).join('');
    const addCategoryForm = c.gradingSystem === 'Total points'
      ? `<div class="academic-category-form">
          <input id="acad-category-name-${c.id}" placeholder="Category (e.g. Exams)">
          <input id="acad-category-earned-${c.id}" type="number" min="0" step="0.1" placeholder="Earned points">
          <input id="acad-category-possible-${c.id}" type="number" min="0.1" step="0.1" placeholder="Possible points">
          <button onclick="addAcademicCategory('${mod.id}','${c.id}')">Add</button>

      : `<div class="academic-category-form">
          <input id="acad-category-name-${c.id}" placeholder="Category (e.g. Exams)">
          <input id="acad-category-weight-${c.id}" type="number" min="0.1" max="100" step="0.1" placeholder="Weight %">
          <input id="acad-category-score-${c.id}" type="number" min="0" max="100" step="0.1" placeholder="Score % (optional)">

        </div>`;
    return `<article class="academic-course-card" style="--course-color:${c.color || '#2D5A27'}">
      <div class="academic-course-header">
        <div><strong>${c.name || 'Unnamed class'}</strong>
          <div class="academic-course-meta">${c.instructor ? `${c.instructor} · ` : ''}${c.gradingSystem || 'Weighted categories'} · ${gradedCategories.length}/${categories.length} categories graded</div>
        </div>
        <span class="academic-grade-pill">${current == null ? '—' : `${current.toFixed(1)}%`}</span>
      </div>
      <div class="academic-course-progress"><span style="width:${Math.max(0, Math.min(100, current || 0))}%"></span></div>
      ${c.gradingSystem === 'Total points' ? '' : `<div class="muted-small">Category weights: ${totalCategoryWeight.toFixed(1)}% / 100%${Math.abs(totalCategoryWeight - 100) > .01 ? ' · weights should total 100%' : ''}</div>`}
      ${categoryRows || '<div class="placeholder-note">Add grading categories to track this course.</div>'}
      ${addCategoryForm}
      <div class="academic-course-settings">
        <label class="muted-small">Target grade <input id="acad-target-${c.id}" type="number" min="0" max="100" step="0.1" value="${c.targetGrade ?? ''}" placeholder="%"></label>
        <label class="muted-small">Final weight <input id="acad-final-weight-${c.id}" type="number" min="0.1" max="100" step="0.1" value="${c.finalWeight ?? ''}" placeholder="%"></label>
        ${needed != null && Number.isFinite(needed) ? `<span class="muted-small">Final (${weight}%): need ${needed.toFixed(1)}%</span>` : ''}
        <button onclick="saveAcademicTarget('${mod.id}','${c.id}')">Save target</button>
        <button onclick="deleteAcademicClass('${mod.id}','${c.id}')">Remove course</button>
      </div>

  }).join('');
  return `<div class="module-block academic-dashboard">
    <div class="module-title">Academic command center</div>
    ${atRisk.length ? `<div class="academic-panel academic-risk-panel"><strong>At-risk classes</strong><div class="muted-small">${atRisk.map(c => `${c.name} (${Number(c.currentGrade).toFixed(1)}%)`).join(' · ')}</div></div>` : ''}
    <div class="academic-summary">
      <div class="academic-stat"><b>${pace}</b><span>Progress vs pace</span></div>
      <div class="academic-stat"><b>${classes.length}</b><span>Classes</span></div>
      <div class="academic-stat"><b>${events.filter(e => e.date >= today.toISOString().slice(0,10)).length}</b><span>Upcoming events</span></div>
    </div>
    <section class="academic-panel">
      <h3>Academic calendar</h3>
      ${renderAcademicCalendar(mod.id)}
      <div class="academic-agenda">
        <div class="academic-agenda-title">Add to planner</div>
        <div class="inline-add-row"><input id="acad-event-${mod.id}" placeholder="Event or task"><input id="acad-date-${mod.id}" type="date" value="${selectedCalendarDate}"><select id="acad-type-${mod.id}"><option>Assignment</option><option>Exam</option><option>Personal</option></select><select id="acad-course-${mod.id}"><option value="">No course</option>${classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select><button class="inline-add-btn" onclick="addAcademicEvent('${mod.id}')">Add</button></div>
      </div>
    </section>
    <div class="academic-grid">
      <section class="academic-panel"><h3>Courses & grading</h3>${classRows || '<div class="placeholder-note">Add your first course.</div>'}
        <div class="academic-course-form">
          <input id="acad-class-${mod.id}" placeholder="Course name">
          <input id="acad-instructor-${mod.id}" placeholder="Instructor (optional)">
          <select id="acad-system-${mod.id}"><option>Weighted categories</option><option>Total points</option></select>
          <button class="inline-add-btn" onclick="addAcademicClass('${mod.id}')">Add course</button>
        </div>
        <div class="muted-small" style="margin-top:8px;">Weighted categories: define each category’s share of the grade. Total points: track earned points against possible points.</div>
      </section>
      <section class="academic-panel">
        <h3>Term & risk settings</h3>
        <div class="inline-add-row"><input type="date" id="acad-start-${mod.id}" value="${a.termStart || ''}" aria-label="Term start date"><input type="date" id="acad-end-${mod.id}" value="${a.termEnd || ''}" aria-label="Term end date"></div>
        <label class="muted-small">At-risk threshold (%) <input type="number" id="acad-risk-${mod.id}" value="${a.riskThreshold ?? 70}" min="0" max="100" style="width:80px;"></label>
        <button class="inline-add-btn" onclick="saveAcademicSettings('${mod.id}')">Save settings</button>
      </section>
      <section class="academic-panel"><h3>Grade calculator</h3>
      <div class="inline-add-row"><input id="grade-current-${mod.id}" type="number" placeholder="Current grade %"><input id="grade-final-${mod.id}" type="number" placeholder="Final weight %"><input id="grade-target-${mod.id}" type="number" placeholder="Target grade %"><button class="inline-add-btn" onclick="calculateAcademicGrade('${mod.id}')">Calculate</button></div>
      <div class="inline-add-row"><input id="grade-score-${mod.id}" type="number" placeholder="Hypothetical score %"><input id="grade-weight-${mod.id}" type="number" placeholder="Assignment weight %"><button class="inline-add-btn" onclick="projectAcademicGrade('${mod.id}')">Project score</button></div>
      <div id="grade-result-${mod.id}" class="muted-small"></div>
      </section>
    </div>
  </div>`;
}

function renderAcademicCalendar(modId) {
  const month = academicCalendarMonth;
  const year = month.getFullYear();
  const monthIndex = month.getMonth();
  const firstDay = new Date(year, monthIndex, 1);
  const gridStart = new Date(year, monthIndex, 1 - firstDay.getDay());
  const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const todayKey = localDateKey(new Date());
  let cells = weekdays.map(day => `<div class="academic-weekday">${day}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const date = new Date(gridStart);
    date.setDate(gridStart.getDate() + i);
    const dateKey = localDateKey(date);
    const items = getCalendarItems(dateKey);
    const classes = [
      'academic-date-cell',
      date.getMonth() !== monthIndex ? 'is-outside' : '',
      dateKey === todayKey ? 'is-today' : '',
      dateKey === selectedCalendarDate ? 'is-selected' : ''
    ].filter(Boolean).join(' ');
    const chips = items.slice(0, 2).map(item => `<span class="academic-event-chip" style="border-color:${item.color}" title="${item.title}${item.done ? ' (done)' : ''}">${item.title}</span>`).join('');
    cells += `<button type="button" class="${classes}" onclick="selectAcademicCalendarDate('${dateKey}')" aria-label="${date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}${items.length ? `, ${items.length} scheduled items` : ''}">
      <span class="academic-date-number">${date.getDate()}</span>
      ${chips}${items.length > 2 ? `<span class="academic-event-chip">+${items.length - 2} more</span>` : ''}
    </button>`;
  }
  return `<div class="academic-calendar-toolbar">
      <strong>${month.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</strong>
      <div class="academic-calendar-actions">
        <button type="button" onclick="changeAcademicCalendarMonth(-1,'${modId}')" aria-label="Previous month">‹</button>
        <button type="button" onclick="goToAcademicCalendarToday('${modId}')">Today</button>
        <button type="button" onclick="changeAcademicCalendarMonth(1,'${modId}')" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="academic-month-grid">${cells}</div>
    ${renderAcademicAgenda(selectedCalendarDate, modId)}`;
}

function renderAcademicAgenda(dateKey, modId) {
  const date = new Date(`${dateKey}T00:00:00`);
  const label = date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const items = getCalendarItems(dateKey);
  const rows = items.map(item => `<div class="item-row" style="cursor:default;${item.done ? 'opacity:.6;text-decoration:line-through;' : ''}">
      <span style="width:10px;height:10px;background:${item.color};margin-top:5px;flex:none;"></span>
      <span style="flex:1"><strong>${item.title}</strong><span class="muted-small"> · ${item.type}${item.className ? ` · ${item.className}` : ''}</span></span>
      ${item.source === 'planner' ? `<button class="log-delete" onclick="deleteAcademicEvent('${modId}','${item.id}')" aria-label="Delete ${item.title}">×</button>` : item.source === 'deadline' ? `<button class="log-delete" onclick="deleteDeadline('${item.moduleId}','${item.id}')" aria-label="Delete ${item.title}">×</button>` : ''}
    </div>`).join('');
  return `<div class="academic-agenda">
    <div class="academic-agenda-title">${label}</div>
    ${rows || '<div class="placeholder-note">No assignments or events scheduled.</div>'}
  </div>`;
}

function selectAcademicCalendarDate(dateKey) {
  selectedCalendarDate = dateKey;
  renderCategoryPage();
}

function changeAcademicCalendarMonth(amount, modId) {
  academicCalendarMonth = new Date(academicCalendarMonth.getFullYear(), academicCalendarMonth.getMonth() + amount, 1);
  selectedCalendarDate = localDateKey(academicCalendarMonth);
  renderCategoryPage();
}

function goToAcademicCalendarToday(modId) {
  const today = new Date();
  academicCalendarMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  selectedCalendarDate = localDateKey(today);
  renderCategoryPage();
}

function getAcademicModule(modId) {
  return getCurrentCategory().modules.find(m => m.id === modId);
}
function saveAcademicSettings(modId) {
  const m = getAcademicModule(modId), a = m.academic;
  const threshold = Number($(`#acad-risk-${modId}`).value);
  if (!Number.isFinite(threshold) || threshold < 0 || threshold > 100) { alert('Set the at-risk threshold from 0 to 100%.'); return; }
  a.termStart = $(`#acad-start-${modId}`).value; a.termEnd = $(`#acad-end-${modId}`).value;
  a.riskThreshold = threshold; persistAndRerenderCategory();
}
function addAcademicClass(modId) {
  const m = getAcademicModule(modId), name = $(`#acad-class-${modId}`).value.trim();
  if (!name) return;
  const gradingSystem = $(`#acad-system-${modId}`).value;
  const instructor = $(`#acad-instructor-${modId}`).value.trim();
  const palette = ['#2D5A27', '#2A3A5C', '#C05621', '#8B3A62', '#B57928', '#1A4A4A'];
  m.academic.classes.push({ id: `class-${Date.now()}`, name, instructor, currentGrade: null, completed: 0, total: 1,
    color: palette[m.academic.classes.length % palette.length], gradingSystem, gradeWeights: [] });
  persistAndRerenderCategory();
}
function deleteAcademicClass(modId, id) {
  const m = getAcademicModule(modId); m.academic.classes = m.academic.classes.filter(c => c.id !== id); persistAndRerenderCategory();
}
function getAcademicCurrentGrade(course) {
  const categories = course.gradeWeights || [];
  if (course.gradingSystem === 'Total points') {
    const graded = categories.filter(category => category.earned != null && category.earned !== '' && Number(category.possible) > 0 && Number.isFinite(Number(category.earned)));
    const possible = graded.reduce((sum, category) => sum + Number(category.possible), 0);
    if (possible > 0) return graded.reduce((sum, category) => sum + Number(category.earned), 0) / possible * 100;
  } else {
    const graded = categories.filter(category => category.score != null && category.score !== '' && Number.isFinite(Number(category.score)));
    const weight = graded.reduce((sum, category) => sum + (Number(category.weight) || 0), 0);
    if (weight > 0) return graded.reduce((sum, category) => sum + Number(category.score) * Number(category.weight), 0) / weight;
  }
  return course.currentGrade == null || course.currentGrade === '' ? null : Number(course.currentGrade);
}
function addAcademicCategory(modId, courseId) {
  const course = getAcademicModule(modId).academic.classes.find(c => c.id === courseId);
  const nameInput = $(`#acad-category-name-${courseId}`);
  const name = nameInput.value.trim();
  if (!name) { alert('Enter a grading category name.'); return; }
  if ((course.gradeWeights || []).some(category => category.name.toLowerCase() === name.toLowerCase())) { alert('That category already exists for this course.'); return; }
  const category = { id: `grade-${Date.now()}`, name };
  if (course.gradingSystem === 'Total points') {
    const earnedValue = $(`#acad-category-earned-${courseId}`).value;
    const possibleValue = $(`#acad-category-possible-${courseId}`).value;
    const possible = Number(possibleValue);
    const earned = Number(earnedValue);
    if (possibleValue !== '' && (!Number.isFinite(possible) || possible <= 0)) { alert('Possible points must be greater than zero.'); return; }
    if (earnedValue !== '' && (!Number.isFinite(earned) || earned < 0 || (possibleValue !== '' && earned > possible))) { alert('Earned points must be between zero and possible points.'); return; }
    category.possible = possibleValue === '' ? null : possible;
    category.earned = earnedValue === '' ? null : earned;
  } else {
    const weight = Number($(`#acad-category-weight-${courseId}`).value);
    const scoreValue = $(`#acad-category-score-${courseId}`).value;
    const score = Number(scoreValue);
    if (!Number.isFinite(weight) || weight <= 0 || weight > 100) { alert('Category weight must be between 0 and 100%.'); return; }
    if (scoreValue !== '' && (!Number.isFinite(score) || score < 0 || score > 100)) { alert('Category score must be between 0 and 100%.'); return; }
    if ((course.gradeWeights || []).reduce((sum, item) => sum + (Number(item.weight) || 0), 0) + weight > 100.01) { alert('Category weights cannot total more than 100%.'); return; }
    category.weight = weight;
    category.score = scoreValue === '' ? null : score;
  }
  if (!course.gradeWeights) course.gradeWeights = [];
  course.gradeWeights.push(category);
  persistAndRerenderCategory();
}
function saveAcademicCategoryScore(modId, courseId, categoryId) {
  const course = getAcademicModule(modId).academic.classes.find(c => c.id === courseId);
  const category = course.gradeWeights.find(item => item.id === categoryId);
  if (course.gradingSystem === 'Total points') {
    const earned = Number($(`#acad-earned-${courseId}-${categoryId}`).value);
    const possible = Number($(`#acad-possible-${courseId}-${categoryId}`).value);
    if (!Number.isFinite(earned) || !Number.isFinite(possible) || possible <= 0 || earned < 0 || earned > possible) {
      alert('Enter valid earned and possible points (earned cannot exceed possible).'); return;
    }
    category.earned = earned;
    category.possible = possible;
  } else {
    const score = Number($(`#acad-score-${courseId}-${categoryId}`).value);
    if (!Number.isFinite(score) || score < 0 || score > 100) { alert('Enter a score from 0 to 100%.'); return; }
    category.score = score;
  }
  persistAndRerenderCategory();
}
function deleteAcademicCategory(modId, courseId, categoryId) {
  const course = getAcademicModule(modId).academic.classes.find(c => c.id === courseId);
  course.gradeWeights = (course.gradeWeights || []).filter(category => category.id !== categoryId);
  persistAndRerenderCategory();
}
function saveAcademicTarget(modId, courseId) {
  const course = getAcademicModule(modId).academic.classes.find(c => c.id === courseId);
  const targetValue = $(`#acad-target-${courseId}`).value;
  const finalWeightValue = $(`#acad-final-weight-${courseId}`).value;
  const target = targetValue === '' ? null : Number(targetValue);
  const finalWeight = finalWeightValue === '' ? null : Number(finalWeightValue);
  if (target !== null && (!Number.isFinite(target) || target < 0 || target > 100)) { alert('Target grade must be between 0 and 100%.'); return; }
  if (finalWeight !== null && (!Number.isFinite(finalWeight) || finalWeight <= 0 || finalWeight > 100)) { alert('Final exam weight must be between 0 and 100%.'); return; }
  course.targetGrade = target;
  course.finalWeight = finalWeight;
  persistAndRerenderCategory();
}
function addAcademicEvent(modId) {
  const m = getAcademicModule(modId), title = $(`#acad-event-${modId}`).value.trim(), date = $(`#acad-date-${modId}`).value;
  if (!title || !date) return;
  const type = $(`#acad-type-${modId}`).value;
  const classId = $(`#acad-course-${modId}`).value;
  const course = m.academic.classes.find(c => c.id === classId);
  m.academic.events.push({ id: `event-${Date.now()}`, title, date, type, classId, className: course?.name || '',
    color: course?.color || (type === 'Exam' ? '#8B3A62' : type === 'Personal' ? '#B57928' : CATEGORY_COLORS.academics) });
  persistAndRerenderCategory();
}
function deleteAcademicEvent(modId, id) {
  const m = getAcademicModule(modId); m.academic.events = m.academic.events.filter(e => e.id !== id); persistAndRerenderCategory();
}
function calculateAcademicGrade(modId) {
  const current = Number($(`#grade-current-${modId}`).value), weight = Number($(`#grade-final-${modId}`).value), target = Number($(`#grade-target-${modId}`).value);
  const result = $(`#grade-result-${modId}`);
  if (!Number.isFinite(current) || !Number.isFinite(weight) || !Number.isFinite(target) || weight <= 0) { result.textContent = 'Enter current grade, final weight, and target grade.'; return; }
  result.textContent = `You need ${((target - current * (1 - weight / 100)) / (weight / 100)).toFixed(1)}% on the final to reach ${target}%.`;
}
function projectAcademicGrade(modId) {
  const current = Number($(`#grade-current-${modId}`).value), score = Number($(`#grade-score-${modId}`).value), weight = Number($(`#grade-weight-${modId}`).value);
  const result = $(`#grade-result-${modId}`);
  if (![current, score, weight].every(Number.isFinite) || weight < 0 || weight > 100) { result.textContent = 'Enter current grade, hypothetical score, and assignment weight.'; return; }
  result.textContent = `Projected grade: ${(current * (1 - weight / 100) + score * (weight / 100)).toFixed(1)}%.`;
}

function renderChecklistModule(mod) {
  const rows = mod.items.map(item => `
    <div class="item-row" onclick="toggleChecklistItem('${mod.id}','${item.id}')">

      <div class="item-label ${item.done ? 'done' : ''}">${item.label}</div>
    </div>`).join('');
  return `<div class="module-block">
    <div class="module-title">${mod.title}</div>
    ${rows}
    <div class="inline-add-row">
      <input type="text" id="add-item-${mod.id}" placeholder="Add an item…" onkeydown="if(event.key==='Enter') addChecklistItem('${mod.id}')">
      <button class="inline-add-btn" onclick="addChecklistItem('${mod.id}')">+</button>

}

function renderNumericModule(mod) {
  const pct = mod.target > 0 ? Math.min(100, (mod.current / mod.target) * 100) : 0;
  return `<div class="module-block">
    <div class="module-title">${mod.title} ${mod.custom ? `<button class="log-delete" style="font-size:12px; float:right;" onclick="deleteGoal('${mod.id}')">remove</button>` : ''}</div>
    <div class="num-row">
      <input type="number" id="num-current-${mod.id}" value="${mod.current}" onchange="updateNumeric('${mod.id}','current',this.value)">

      <input type="number" id="num-target-${mod.id}" value="${mod.target}" onchange="updateNumeric('${mod.id}','target',this.value)">
      <div class="num-track"><div class="num-fill" style="width:${pct}%;"></div></div>
    </div>
  </div>`;
}

function renderPaycalcModule(mod) {
  const gross = (mod.hours || 0) * (mod.rate || 0);
  const tax = gross * ((mod.taxRate || 0) / 100);
  const net = gross - tax;
  return `<div class="module-block">
    <div class="module-title">${mod.title}</div>
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <label style="flex:1; font-size:11px; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; font-weight:700;">Hours
        <input type="number" value="${mod.hours}" onchange="updateNumeric('${mod.id}','hours',this.value)" style="width:100%; margin-top:4px;">
      </label>
      <label style="flex:1; font-size:11px; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; font-weight:700;">Rate ($)
        <input type="number" value="${mod.rate}" onchange="updateNumeric('${mod.id}','rate',this.value)" style="width:100%; margin-top:4px;">
      </label>

const DEADLINE_TYPES = ['Assignment', 'Exam', 'Quiz', 'Project', 'Other'];

function daysUntil(dueDateStr) {
  const due = new Date(dueDateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.round((due - now) / 86400000);
}

function countdownInfo(days) {
  if (days < 0) return { label: `Overdue by ${-days}d`, cls: 'deadline-overdue' };
  if (days === 0) return { label: 'DUE TODAY', cls: 'deadline-today' };
  if (days === 1) return { label: 'Due tomorrow', cls: 'deadline-soon' };
  if (days <= 3) return { label: `Due in ${days}d`, cls: 'deadline-soon' };
  return { label: `Due in ${days}d`, cls: '' };
}

function renderDeadlinesModule(mod) {
  const academicDashboard = getCurrentCategory().modules.find(m => m.type === 'academicDashboard');
  const academicClasses = academicDashboard?.academic?.classes || [];
  const sorted = [...(mod.entries || [])].sort((a, b) => {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1;
    return a.dueDate.localeCompare(b.dueDate);
  });
  const rows = sorted.map(d => {
    const cd = d.done ? { label: 'Completed', cls: '' } : countdownInfo(daysUntil(d.dueDate));
    return `<div class="item-row" style="cursor:default;">
      <div class="item-checkbox ${d.done ? 'checked' : ''}" style="cursor:pointer;" onclick="toggleDeadlineDone('${mod.id}','${d.id}')">${d.done ? '✓' : ''}</div>
      <div style="flex:1;">
        <div class="item-label ${d.done ? 'done' : ''}">${d.title}</div>
        <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); margin-top:4px; font-weight:600;">
          ${d.course ? d.course + ' · ' : ''}${d.type} · ${d.dueDate} · <span class="${cd.cls}">${cd.label}</span>
        </div>
      </div>
      <button class="log-delete" onclick="deleteDeadline('${mod.id}','${d.id}')">×</button>
    </div>`;
  }).join('');

  return `<div class="module-block">
    <div class="module-title">${mod.title}</div>
    ${rows || '<div class="placeholder-note">Nothing due — add an assignment, exam, or project below.</div>'}
    <div style="margin-top:14px; border-top: 1px dashed var(--gold-dim); padding-top: 14px;">
      <input type="text" id="dl-title-${mod.id}" placeholder="Title (e.g. Midterm essay)" style="width:100%; margin-bottom:8px; border:1px solid var(--gold-dim); padding:10px 12px; font-family:inherit; font-size:14px; outline:none;">
      <div style="display:flex; gap:8px; margin-bottom:8px;">
        <select id="dl-course-${mod.id}" style="flex:1; border:1px solid var(--gold-dim); padding:10px 12px; font-family:inherit; font-size:14px; outline:none; background:var(--cream);">
          <option value="">No course</option>${academicClasses.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
        </select>
        <select id="dl-type-${mod.id}" style="flex:1; border:1px solid var(--gold-dim); padding:10px 12px; font-family:inherit; font-size:14px; outline:none; background:var(--cream);">
          ${DEADLINE_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}
        </select>
      </div>
      <div class="inline-add-row" style="margin-top:0;">
        <input type="date" id="dl-date-${mod.id}" style="flex:1;">
        <button class="inline-add-btn" onclick="addDeadline('${mod.id}')">+</button>
      </div>
    </div>

async function persistAndRerenderCategory() {
  renderCategoryPage();
  const indicator = $('#catSaveIndicator');
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  indicator.textContent = 'Saving…';
  const { error } = await sb.from('app_data').upsert({
    user_id: user.id,
    key: LEDGER_KEY,
    value: ledgerData,
    updated_at: new Date().toISOString()
  });
  indicator.textContent = error ? ('Save failed: ' + error.message) : 'Saved ✓';
  if (!error) setTimeout(() => { if (indicator.textContent === 'Saved ✓') indicator.textContent = ''; }, 1500);
}

function renderCalStrip() {
  const strip = $('#calStrip');
  const today = new Date();
  const dowLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const startOfWeek = new Date(today);
  startOfWeek.setDate(today.getDate() - today.getDay());
  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate() + i);
    const dateKey = localDateKey(d);
    const isToday = d.toDateString() === today.toDateString();
    const items = getCalendarItems(dateKey);
    const previews = items.slice(0, 2).map(item => `<span class="cal-day-item" style="border-color:${item.color};" title="${item.title}">${item.title}</span>`).join('');
    html += `<button type="button" class="cal-day ${isToday ? 'is-today' : ''} ${selectedCalendarDate === dateKey ? 'is-selected' : ''}" onclick="selectCalendarDate('${dateKey}')">
      <div class="dow">${dowLabels[d.getDay()]}</div>
      <div class="dnum">${d.getDate()}</div>
      ${items.length ? `<div class="cal-day-items">${previews}${items.length > 2 ? `<span class="cal-day-item">+${items.length - 2} more</span>` : ''}</div>` : ''}
    </button>`;
  }
  strip.innerHTML = html;
  renderCalendarDayDetails();
}

function getCalendarItems(dateKey) {
  if (!ledgerData) return [];
  const items = [];
  const academics = ledgerData.categories.find(category => category.id === 'academics');
  const dashboard = academics?.modules.find(module => module.type === 'academicDashboard');
  const academicData = dashboard?.academic;
  const classes = academicData?.classes || [];
  (academicData?.events || []).filter(event => event.date === dateKey).forEach(event => {
    items.push({ id: event.id, title: event.title, type: event.type, className: event.className || classes.find(c => c.id === event.classId)?.name || '',
      color: event.color || classes.find(c => c.id === event.classId)?.color || CATEGORY_COLORS.academics, done: false, source: 'planner' });
  });
  const deadlineModule = academics?.modules.find(module => module.id === 'deadlines');
  (deadlineModule?.entries || []).filter(entry => entry.dueDate === dateKey).forEach(entry => {
    const course = classes.find(c => c.name === entry.course);
    items.push({ id: entry.id, moduleId: deadlineModule.id, title: entry.title, type: entry.type || 'Assignment',
      className: entry.course || '', color: course?.color || CATEGORY_COLORS.academics, done: !!entry.done, source: 'deadline' });
  });
  return items;
}

function selectCalendarDate(dateKey) {
  selectedCalendarDate = dateKey;
  renderCalStrip();
}

function renderCalendarDayDetails() {
  const container = $('#calendarDayDetails');
  if (!container) return;
  const items = getCalendarItems(selectedCalendarDate);
  const date = new Date(`${selectedCalendarDate}T00:00:00`);
  const label = date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  container.innerHTML = `<strong>${label}</strong>` + (items.length
    ? items.map(item => `<div class="item-row" style="cursor:default;${item.done ? 'opacity:.6;text-decoration:line-through;' : ''}"><span style="width:10px;height:10px;background:${item.color};margin-top:5px;flex:none;"></span><span style="flex:1">${item.title}</span><span class="muted-small">${item.type}${item.done ? ' · done' : ''}</span></div>`).join('')
    : '<div class="placeholder-note">Nothing scheduled for this day.</div>');
}

function nextIncompleteItem(mod) {
